# REVIEW-ONLY QA candidate. Requires the already audited stage helper module.
name: Diagnose exact verified APK signatures (read only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.repository == 'dkdjndbfj-wq/salcara-image-mobile' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0ac29da63fd6f9049ecb0da011faf19361dda73e
          path: tested-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Collect public signature fields only (not release acceptance)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/diagnose_verified_apk_signatures.py
