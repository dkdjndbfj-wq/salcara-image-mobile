name: Android Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/verify-release-version.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Restore release keystore
        env:
          SALCARA_KEYSTORE_BASE64: ${{ secrets.SALCARA_KEYSTORE_BASE64 }}
        run: echo "$SALCARA_KEYSTORE_BASE64" | base64 --decode > android/app/salcara-release.jks
      - name: Configure release signing
        env:
          SALCARA_KEYSTORE_FILE: salcara-release.jks
          SALCARA_KEYSTORE_PASSWORD: ${{ secrets.SALCARA_KEYSTORE_PASSWORD }}
          SALCARA_KEY_ALIAS: ${{ secrets.SALCARA_KEY_ALIAS }}
          SALCARA_KEY_PASSWORD: ${{ secrets.SALCARA_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs
      - name: Build signed APK
        working-directory: android
        env:
          SALCARA_KEYSTORE_FILE: salcara-release.jks
          SALCARA_KEYSTORE_PASSWORD: ${{ secrets.SALCARA_KEYSTORE_PASSWORD }}
          SALCARA_KEY_ALIAS: ${{ secrets.SALCARA_KEY_ALIAS }}
          SALCARA_KEY_PASSWORD: ${{ secrets.SALCARA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Download previous signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p previous-release
          gh release download --pattern '*.apk' --dir previous-release || true
      - name: Verify overwrite-install compatibility
        shell: bash
        run: |
          previous_apk="$(find previous-release -maxdepth 1 -name '*.apk' -print -quit)"
          bash scripts/verify-apk-upgrade.sh android/app/build/outputs/apk/release/app-release.apk "$previous_apk"
      - name: Name APK and checksum
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          cp android/app/build/outputs/apk/release/app-release.apk "salcara-image-android-${VERSION}.apk"
          sha256sum "salcara-image-android-${VERSION}.apk" > "salcara-image-android-${VERSION}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: salcara-image-android
          path: |
            salcara-image-android-*.apk
            salcara-image-android-*.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" salcara-image-android-*.apk salcara-image-android-*.sha256 --title "Salcara Image $GITHUB_REF_NAME" --generate-notes --notes "Android 签名 APK 与 SHA-256 校验文件。安装和服务商配置方法见仓库 README；隐私说明见 PRIVACY.md。"
