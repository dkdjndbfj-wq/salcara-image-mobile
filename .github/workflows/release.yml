name: Android Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
      - run: node scripts/verify-release-version.mjs
      - name: Resolve artifact version (manual builds do not publish)
        id: version
        run: echo "tag=v$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/update-manifest-core.test.mjs scripts/release-workflow-contract.test.mjs
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Restore release keystore
        env:
          SALCARA_KEYSTORE_BASE64: ${{ secrets.SALCARA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$SALCARA_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$SALCARA_KEYSTORE_BASE64" | base64 --decode > android/app/salcara-release.jks
          test -s android/app/salcara-release.jks
      - name: Configure release signing
        env:
          SALCARA_KEYSTORE_FILE: salcara-release.jks
          SALCARA_KEYSTORE_PASSWORD: ${{ secrets.SALCARA_KEYSTORE_PASSWORD }}
          SALCARA_KEY_ALIAS: ${{ secrets.SALCARA_KEY_ALIAS }}
          SALCARA_KEY_PASSWORD: ${{ secrets.SALCARA_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs
      - name: Build signed APK
        working-directory: android
        env:
          SALCARA_KEYSTORE_FILE: salcara-release.jks
          SALCARA_KEYSTORE_PASSWORD: ${{ secrets.SALCARA_KEYSTORE_PASSWORD }}
          SALCARA_KEY_ALIAS: ${{ secrets.SALCARA_KEY_ALIAS }}
          SALCARA_KEY_PASSWORD: ${{ secrets.SALCARA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Download previous signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p previous-release
          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isDraft,isPrerelease | jq -r --arg current "$GITHUB_REF_NAME" 'map(select(.isDraft == false and .isPrerelease == false and .tagName != $current))[0].tagName // empty')"
          echo "SALCARA_PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"
          if [[ -n "$previous_tag" ]]; then
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern "salcara-image-android-${previous_tag}.apk" --dir previous-release
          fi
          find previous-release -maxdepth 1 -type f -name '*.apk' -size +1k -print
      - name: Verify overwrite-install compatibility
        shell: bash
        run: |
          previous_apk=""
          if [[ -n "$SALCARA_PREVIOUS_TAG" ]]; then
            previous_apk="previous-release/salcara-image-android-${SALCARA_PREVIOUS_TAG}.apk"
            if [[ ! -s "$previous_apk" ]]; then
              echo "Previous release exists, but its exact production APK could not be retrieved. Refusing to skip upgrade verification."
              exit 1
            fi
          fi
          bash scripts/verify-apk-upgrade.sh android/app/build/outputs/apk/release/app-release.apk "$previous_apk"
      - name: Name APK and checksum
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          cp android/app/build/outputs/apk/release/app-release.apk "salcara-image-android-${VERSION}.apk"
          sha256sum "salcara-image-android-${VERSION}.apk" > "salcara-image-android-${VERSION}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: salcara-image-android
          path: |
            salcara-image-android-*.apk
            salcara-image-android-*.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="docs/RELEASE-${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" salcara-image-android-*.apk salcara-image-android-*.sha256 --title "Salcara AI $GITHUB_REF_NAME" --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" salcara-image-android-*.apk salcara-image-android-*.sha256 --title "Salcara AI $GITHUB_REF_NAME" --generate-notes --notes "Android 签名 APK 与 SHA-256。安装和服务商配置见 README；隐私说明见 PRIVACY.md。"
          fi
      - name: Publish released-only update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SALCARA_APK_MIRROR_BASE_URL: ${{ vars.SALCARA_APK_MIRROR_BASE_URL }}
        run: node scripts/publish-update-manifest.mjs
      - name: Remove ephemeral signing identity
        if: always()
        run: rm -f android/app/salcara-release.jks
