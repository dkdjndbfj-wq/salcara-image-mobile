plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'top.salcara'
version = '1.0.0'

android {
  namespace "expo.modules.salcaradirecttransport"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  sourceSets {
    main {
      java.srcDirs += ['kotlin']
    }
  }
}

dependencies {
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
